apiVersion: apps/v1
kind: Deployment

metadata:
  name: ui-deployment
  labels:
    app: ui

spec:
  replicas: 2

  selector:
    matchLabels:
      app: ui

  template:
    metadata:
      labels:
        app: ui

    spec:
      containers:
      - name: ui-container

        image: pavankalyan1503/ui-image:latest

        imagePullPolicy: Always

        ports:
        - containerPort: 80

        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"

          limits:
            memory: "256Mi"
            cpu: "200m"

---
apiVersion: v1
kind: Service

metadata:
  name: ui-service

spec:
  type: LoadBalancer

  selector:
    app: ui

  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
